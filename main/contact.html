<!DOCTYPE html>
<html lang="en" ng-app="wcwsApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - WCWS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="ContactCtrl">

  <div ng-include="'../includes/navbar.html'"></div>

  <section class="container py-5">
    <h2 class="text-center mb-4">Contact Us</h2>
    <div class="row">
      <div class="col-md-6">
        <form ng-submit="sendMessage()" class="shadow p-4 rounded bg-light">
          <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" ng-model="contact.name" required>
          </div>
          <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" ng-model="contact.email" required>
          </div>
          <div class="mb-3">
            <label>Message</label>
            <textarea class="form-control" ng-model="contact.message" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send Message</button>
          <p class="text-success mt-3" ng-if="successMsg">{{successMsg}}</p>
        </form>
      </div>

      <div class="col-md-6">
        <h5 class="mb-3">Reach Us At:</h5>
        <p><b>Address:</b> Janakpur, Dhanusha, Nepal</p>
        <p><b>Phone:</b> +977-9746575954</p>
        <p><b>Email:</b> mttbus@gmail.com</p>
        <div class="mt-4">
          <iframe src="https://maps.google.com/maps?q=janakpur&t=&z=13&ie=UTF8&iwloc=&output=embed" 
                  width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </section>

  <script>
    angular.module('wcwsApp', [])
    .controller('ContactCtrl', function($scope) {
      $scope.sendMessage = function() {
        $scope.successMsg = "Thank you, " + $scope.contact.name + "! Your message has been sent.";
      };
    });
  </script>

  <div ng-include="'../includes/footer.html'"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
