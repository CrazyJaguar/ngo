<!DOCTYPE html>
<html lang="en" ng-app="ngoApp">
<head>
  <meta charset="UTF-8">
  <title>Blog Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-sanitize.min.js"></script>
</head>
<body ng-controller="DetailsCtrl" class="container mt-4">

  <div ng-include="'../includes/navbar.html'"></div>

  <h1 class="text-center mb-4">{{ title }}</h1>

  <!-- ✅ Add ng-bind-html here -->
  <div id="blogContent" class="border p-3 bg-light rounded shadow-sm" ng-bind-html="blogContent"></div>

  <div class="text-center mt-3">
    <a href="blogs.html" class="btn btn-secondary">← Back to Blogs</a>
  </div>

<script>
angular.module('ngoApp', ['ngSanitize'])
.controller('DetailsCtrl', function($scope, $http, $sce) {
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');
  $scope.title = params.get('title');

  console.log("Trying to load:", file);

  if (file) {
    // Ensure the path is correct relative to this HTML file
    const path = file.startsWith('blogs/') ? file : '../blogs/' + file.split('/').pop();

    $http.get(path)
      .then(function(response) {
        console.log("Loaded successfully:", path);
        // Trust HTML and show it
        $scope.blogContent = $sce.trustAsHtml(response.data.replace(/\n/g, "<br>"));
      })
      .catch(function(error) {
        console.error("Error loading file:", error);
        $scope.blogContent = $sce.trustAsHtml("⚠️ Unable to load this blog file. Please check console for details.");
      });
  } else {
    $scope.blogContent = $sce.trustAsHtml("⚠️ No blog file specified in the link.");
  }
});
</script>
<div ng-include="'../includes/footer.html'"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
