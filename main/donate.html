<!DOCTYPE html>
<html lang="en" ng-app="donateApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate - WCWS</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- AngularJS -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

  <!-- Animate.css -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom right, #f8fafc, #e3f2fd);
      font-family: 'Poppins', sans-serif;
    }
    .donate-container {
      max-width: 650px;
      margin: 80px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 40px;
    }
    .btn-donate {
      background-color: #0d6efd;
      color: white;
      border-radius: 50px;
      transition: 0.3s;
    }
    .btn-donate:hover {
      background-color: #0b5ed7;
      transform: scale(1.05);
    }
    .payment-option {
      border: 2px solid #dee2e6;
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .payment-option:hover {
      border-color: #0d6efd;
      background-color: #f0f8ff;
      transform: translateY(-3px);
    }
    .thankyou {
      display: none;
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body ng-controller="DonateController">

  <!-- Navbar Include -->
  <div ng-include="'../includes/navbar.html'"></div>

  <div class="donate-container animate__animated animate__fadeInUp">
    <h2 class="text-center mb-4">Support Our Cause 💖</h2>
    <p class="text-center text-muted mb-4">Your donation helps us empower women and children through education, training, and welfare programs.</p>

    <form name="donateForm" ng-submit="submitDonation()" novalidate>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" ng-model="donor.name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" ng-model="donor.email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Donation Amount (NPR)</label>
        <input type="number" class="form-control" ng-model="donor.amount" min="1" required>
      </div>

      <h5 class="mt-4">Choose Payment Method</h5>
      <div class="d-flex justify-content-between mt-3">
        <div class="payment-option text-center" ng-click="selectMethod('esewa')">
          <img src="https://upload.wikimedia.org/wikipedia/en/f/f9/ESewa_logo.png" alt="eSewa" width="80"><br>
          <small>eSewa</small>
        </div>
        <div class="payment-option text-center" ng-click="selectMethod('khalti')">
          <img src="https://upload.wikimedia.org/wikipedia/en/1/1b/Khalti_Digital_Wallet_Logo.png" alt="Khalti" width="80"><br>
          <small>Khalti</small>
        </div>
        <div class="payment-option text-center" ng-click="selectMethod('bank')">
          <img src="https://cdn-icons-png.flaticon.com/512/3135/3135670.png" alt="Bank" width="80"><br>
          <small>Bank Transfer</small>
        </div>
      </div>

      <div class="mt-4 text-center">
        <button type="submit" class="btn btn-donate px-4 py-2" ng-disabled="!donor.method">Donate Now</button>
      </div>
    </form>

    <div class="thankyou animate__animated animate__fadeIn">
      <h3 class="text-success mt-4">Thank You! 💐</h3>
      <p>Your support means a lot to us.</p>
    </div>
  </div>

  <!-- Footer Include -->
  <div ng-include="'../includes/footer.html'"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    var app = angular.module('donateApp', []);

    app.controller('DonateController', function($scope, $timeout) {
      $scope.donor = { method: null };

      $scope.selectMethod = function(method) {
        $scope.donor.method = method;
      };

      $scope.submitDonation = function() {
        if ($scope.donor.method === 'esewa') {
          window.open('https://esewa.com', '_blank'); // Replace with your eSewa link
        } else if ($scope.donor.method === 'khalti') {
          window.open('https://khalti.com', '_blank'); // Replace with your Khalti link
        } else if ($scope.donor.method === 'bank') {
          alert("Please transfer to:\nBank: Nabil Bank Ltd.\nAccount Name: WCWS NGO\nAccount No: 001234567890");
        }

        document.querySelector('.thankyou').style.display = 'block';
        document.querySelector('.donate-container form').style.display = 'none';
      };
    });
  </script>
</body>
</html>
